name: unibites
description: Skip the line, grab the bite.
publish_to: 'none'

version: 0.5.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  firebase_messaging: ^15.1.1
  
  # Navigation
  go_router: ^17.1.0
  
  # HTTP
  http: ^1.3.0
  
  # UI & Design
  google_fonts: ^8.0.1
  intl: ^0.20.2
  
  # Utilities
  provider: ^6.1.1
  
  # Google Sign-in
  google_sign_in: ^7.2.0

  # MongoDB
  mongo_dart: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21 # android min sdk must be 21 or higher

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

dependency_overrides:
  archive: ^3.6.1
